services:
  postgres:
    image: postgres:18                          # Επίσημο image της PostgreSQL 18
    container_name: taskmanager-db              # Σταθερό όνομα του container για ευκολότερη αναφορά
    environment:
      POSTGRES_USER: "${DB_USER}"               # user, password και βάση από το .env
      POSTGRES_PASSWORD: "${DB_USER_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "${DB_PORT}:5432"                       # port mapping - host port από .env (5433), container port 5432 (default PostgreSQL port)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
